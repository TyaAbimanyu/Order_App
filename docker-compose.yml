version: '3.9'

networks:
  jobseeker-network:
    driver: bridge

volumes:
  pgsql_data:

services:
  db:
    image: postgres:16.1-alpine
    container_name: jobseeker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
    ports:
      - 5432:${DB_PORT:-5432}
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      - ./.docker/postgres/init:/docker-entrypoint-initdb.d/
      - ./.docker/postgres/postgres.conf:/etc/postgresql.conf
    networks:
      - jobseeker-network
  php:
    build:
      args:
          user: jobseeker-user
          uid: 1000
      context: .docker
      dockerfile: Dockerfile
    image: jobseeker-php
    container_name: jobseeker-ci4
    restart: unless-stopped
    tty: true
    depends_on:
      - db
      # environment:
      # DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@127.0.0.1:5432/${DB_DATABASE}
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - jobseeker-network
  nginx:
    image: nginx:1.17-alpine
    container_name: jobseeker-nginx
    restart: unless-stopped
    ports:
      - 8080:80
    depends_on:
      - php
    volumes:
      - ./:/var/www
      - ./.docker/nginx:/etc/nginx/conf.d
    networks:
      - jobseeker-network

